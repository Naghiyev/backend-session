# Lesson 5 - PostgreSQL + Spring Data JPA
spring.application.name=task-management-api
server.port=8080

# --- Datasource (docker-compose ilə uyğun) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update: sxem entity-lərə görə avtomatik yenilənir (yalnız development üçün!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null
logging.level.az.training.taskmanagement=INFO

# --- Lesson 6: logging ---
logging.level.root=INFO
logging.level.az.training.taskmanagement=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level [%logger{20}] - %msg%n

# --- Lesson 8: JWT security (introductory) ---
# DİQQƏT: production-da secret environment variable-dan gəlməlidir, koda yazılmamalı!
app.jwt.secret=${JWT_SECRET:change-this-secret-key-min-32-bytes-long-1234567890}
app.jwt.expiration-ms=3600000

# Demo login (real layihədə istifadəçilər database-də olur)
app.security.demo-username=${DEMO_USER:admin}
app.security.demo-password=${DEMO_PASS:admin123}
app.security.demo-role=ADMIN

# --- Caching (in-memory; production-da Redis) ---
spring.cache.type=simple

# --- Transactional Outbox + Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all: bütün replikalar təsdiqləməlidir; idempotence: producer retry dublikat yaratmasın
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Outbox relay parametrləri (OutboxProperties)
outbox.poll-interval=1000
outbox.batch-size=100
outbox.max-attempts=10
outbox.send-timeout=5s
outbox.retention=7d
outbox.cleanup-cron=0 15 3 * * *
