# Lesson 4 - Spring Boot konfiqurasiyası
spring.application.name=task-management-api
server.port=8080

# JSON-da null sahələri gizlət (istəyə bağlı)
spring.jackson.default-property-inclusion=non_null

# Log səviyyəsi
logging.level.az.training.taskmanagement=INFO

spring.datasource.url=jdbc:postgresql://localhost:5432/backend-session-db
spring.datasource.username=postgres
spring.datasource.password=mysecurepassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true