# Lesson 5 - PostgreSQL + Spring Data JPA
spring.application.name=task-management-api
server.port=8080

# --- Datasource (docker-compose ilə uyğun) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update: sxem entity-lərə görə avtomatik yenilənir (yalnız development üçün!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null
logging.level.az.training.taskmanagement=INFO

# --- Lesson 6: logging ---
logging.level.root=INFO
logging.level.az.training.taskmanagement=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level [%logger{20}] - %msg%n

# --- Lesson 8: JWT security (introductory) ---
# DİQQƏT: production-da secret environment variable-dan gəlməlidir, koda yazılmamalı!
app.jwt.secret=${JWT_SECRET:change-this-secret-key-min-32-bytes-long-1234567890}
app.jwt.expiration-ms=3600000

# Demo login (real layihədə istifadəçilər database-də olur)
app.security.demo-username=${DEMO_USER:admin}
app.security.demo-password=${DEMO_PASS:admin123}
app.security.demo-role=ADMIN

# --- Caching (in-memory; production-da Redis) ---
spring.cache.type=simple
