# Lesson 4 - Spring Boot konfiqurasiyas?
spring.application.name=task-management-api
server.port=8080

# PostgreSQL ba?lant?s? (docker-compose.yml il? eyni)
spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=taskuser
spring.datasource.password=taskpass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSON-da null sah?l?ri gizl?t (ist?y? ba?l?)
spring.jackson.default-property-inclusion=non_null

# Log s?viyy?si
logging.level.az.training.taskmanagement=INFO