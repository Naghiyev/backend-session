openapi: 3.0.3
info:
  title: Task Management API
  description: User və Task idarəetmə API-si (Spring Boot + PostgreSQL + Spring Data JPA)
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Users
  - name: Tasks
  - name: Categories
paths:
  /users:
    post:
      tags: [Users]
      summary: Yeni user yarat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User yaradıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Yanlış input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Email artıq mövcuddur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /users/{id}:
    get:
      tags: [Users]
      summary: User-i id ilə al
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '404':
          description: User tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /users/{id}/tasks:
    get:
      tags: [Users]
      summary: User-in bütün task-larını al
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskResponse' }
        '404':
          description: User tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /categories:
    post:
      tags: [Categories]
      summary: Yeni category yarat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: Category yaradıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400':
          description: Yanlış input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Bu adlı category artıq mövcuddur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      tags: [Categories]
      summary: Bütün category-lər
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryResponse' }
  /categories/{id}:
    get:
      tags: [Categories]
      summary: Category-ni id ilə al
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '404':
          description: Category tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /tasks:
    post:
      tags: [Tasks]
      summary: Yeni task yarat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Task yaradıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400':
          description: Yanlış input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Aid olduğu user tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      tags: [Tasks]
      summary: Bütün task-lar (status filtri ilə)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskResponse' }
  /tasks/by-user/{userId}:
    get:
      tags: [Tasks]
      summary: User-in task-ları status üzrə (derived query findByUser_IdAndStatus)
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - name: status
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskResponse' }
        '400':
          description: Yanlış status dəyəri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: User tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /tasks/by-user/{userId}/priority:
    get:
      tags: [Tasks]
      summary: User-in task-ları priority üzrə, yenilər birinci (custom JPQL @Query)
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - name: priority
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Priority' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskResponse' }
        '400':
          description: Yanlış priority dəyəri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: User tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Task-ı id ilə al
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '404':
          description: Task tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      tags: [Tasks]
      summary: Task-ı qismən yenilə
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Yeniləndi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '404':
          description: Task tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [Tasks]
      summary: Task-ı sil (user silinmir)
      description: Yalnız task silinir. Əlaqəli user və category qalır.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Silindi (məzmun yoxdur)
        '404':
          description: Task tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: "Darya" }
        email: { type: string, format: email, example: "darya@example.com" }
    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: "Darya" }
        email: { type: string, example: "darya@example.com" }
    CreateTaskRequest:
      type: object
      required: [title, userId]
      properties:
        title: { type: string, example: "Backend syllabus hazırla" }
        description: { type: string, example: "8 dərslik plan" }
        priority: { $ref: '#/components/schemas/Priority' }
        userId: { type: integer, format: int64, example: 1 }
        categoryId: { type: integer, format: int64, nullable: true, example: 1 }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        categoryId: { type: integer, format: int64, nullable: true, example: 1 }
    TaskResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Backend syllabus hazırla" }
        description: { type: string, example: "8 dərslik plan" }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        userId: { type: integer, format: int64, example: 1 }
        categoryId: { type: integer, format: int64, nullable: true, example: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Work" }
    CategoryResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: "Work" }
    ApiError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, example: 404 }
        error: { type: string, example: "Not Found" }
        message: { type: string, example: "Task tapılmadı: id=99" }
        path: { type: string, example: "/tasks/99" }