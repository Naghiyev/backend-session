openapi: 3.0.3
info:
  title: Task Management API
  description: >
    "Backend Development Fundamentals with Java" təliminin layihəsi.
    Bu spesifikasiya Dərs 3-də REST kontraktı kimi dizayn edilir və
    Dərs 4-dən etibarən Spring Boot ilə implementasiya olunur.
  version: 0.3.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Users
  - name: Tasks
paths:
  /users:
    get:
      tags: [Users]
      summary: Bütün user-ləri al və ada görə axtar
      parameters:
        - name: name
          in: query
          required: false
          description: Adın bir hissəsi; böyük-kiçik hərf fərqi nəzərə alınmır. Boş olduqda bütün user-lər qaytarılır.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserResponse' }
    post:
      tags: [Users]
      summary: Yeni user yarat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User yaradıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Yanlış input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Email artıq mövcuddur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /users/{id}:
    get:
      tags: [Users]
      summary: User-i id ilə al
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '404':
          description: User tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /users/{id}/tasks:
    get:
      tags: [Users]
      summary: User-in bütün task-larını al
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskResponse' }
        '404':
          description: User tapılmadı
  /tasks:
    post:
      tags: [Tasks]
      summary: Yeni task yarat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Task yaradıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400':
          description: Yanlış input
        '404':
          description: Aid olduğu user tapılmadı
    get:
      tags: [Tasks]
      summary: Bütün task-lar (status filtri ilə)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskResponse' }
  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Task-ı id ilə al
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '404':
          description: Task tapılmadı
    patch:
      tags: [Tasks]
      summary: Task-ı qismən yenilə
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Yeniləndi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '404':
          description: Task tapılmadı
    delete:
      tags: [Tasks]
      summary: Task-ı sil
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Silindi (məzmun yoxdur)
        '404':
          description: Task tapılmadı
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: "Darya" }
        email: { type: string, format: email, example: "darya@example.com" }
    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: "Darya" }
        email: { type: string, example: "darya@example.com" }
    CreateTaskRequest:
      type: object
      required: [title, userId]
      properties:
        title: { type: string, example: "Backend syllabus hazırla" }
        description: { type: string, example: "8 dərslik plan" }
        priority: { $ref: '#/components/schemas/Priority' }
        userId: { type: integer, format: int64, example: 1 }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
    TaskResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Backend syllabus hazırla" }
        description: { type: string, example: "8 dərslik plan" }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        userId: { type: integer, format: int64, example: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApiError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, example: 404 }
        error: { type: string, example: "Not Found" }
        message: { type: string, example: "Task tapılmadı: id=99" }
        path: { type: string, example: "/tasks/99" }
